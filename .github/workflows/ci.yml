name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The round-4 full run took 884.68 s on the development machine (463 passed, 2 failed; see
    # scratchpad fix log R4-F6). A 15-minute limit was shorter than that run, so the limit is 30.
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs. The comment names the release tag each SHA was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Node is pinned to major 24 (the version the front-end tests were run on). The JavaScript
      # tests run inside pytest (tests/test_theatre_model.py). Locally they skip when node is
      # missing. The check below makes a missing node fail this job instead of skipping silently.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check that node is on PATH
        run: node --version

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Lint
        run: uv run ruff check src tests

      - name: Test (Python and front-end)
        run: uv run pytest -q
