# Alpha Lab settings. Validated with pydantic at startup (src/alpha_lab/config.py).

[dates]
start = "2010-01-01"
train_end = "2018-12-31"
validation_end = "2021-12-31"
holdout_end = "2025-12-31"

[data]
ffill_limit_days = 3              # forward-fill gaps of up to this many trading days (rows of the price index)
max_missing_fraction = 0.02       # drop a ticker if more of its training-window rows (start to train_end) are missing
flag_return_large = 0.15          # flag (never delete) daily moves beyond this
flag_return_extreme = 0.50        # ...and mark these as extreme

[backtest]
cost_bps_per_side = 5.0
max_gross_leverage = 1.0
annualization_days = 252
min_history_days = 260            # signal days before this are ignored

[gates]
min_train_sharpe = 0.5
min_validation_sharpe = 0.3
max_turnover_daily = 0.5

[agents]
ideas_model = "claude-haiku-5-5"
coder_model = "claude-haiku-5-5"
critic_model = "claude-sonnet-5-5"
max_revisions = 3
max_tokens_per_call = 4000
context_limit_tokens = 90000      # target for the estimated prompt size, 3.5 characters per token (llm.py); Haiku 5.5 prices above 100K

[run]
default_budget_usd = 2.0
max_concurrency = 10
seed = 42

[dedup]
similarity_threshold = 0.85       # reject an idea whose name+description is this similar to an earlier one

[diversity]
# One theme is drawn at random for each pipeline, using run.seed directly.
themes = [
    "momentum",
    "mean reversion",
    "volatility",
    "cross-sectional ranking",
    "sector rotation",
    "seasonality",
    "trend filters",
    "pairs and relative value",
]

[sandbox]
timeout_seconds = 30
allowed_imports = ["numpy", "pandas", "math"]

# USD per million tokens. Verified by the project owner against this page on 2026-10-08.
[pricing]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
verified_on = "2026-10-08"

long_context_threshold_tokens = 100000  # prompts above this use the *_over_100k prices

[pricing.models.claude-haiku-5-5]
input = 0.10
output = 0.50
input_over_100k = 0.50            # prompts above 100K tokens
output_over_100k = 2.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_5m_over_100k = 0.625
cache_read_over_100k = 0.05

[pricing.models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write_5m = 2.50
